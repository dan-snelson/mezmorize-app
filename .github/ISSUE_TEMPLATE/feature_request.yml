name: Feature Request
description: Suggest an improvement for Mezmorize
title: "[Feature]: "
labels: ["enhancement"]
type: Feature
assignees:
  - dan-snelson
body:
  - type: markdown
    attributes:
      value: |
        **Note:** While all requests are welcome, finding available cycles to build a feature we won't use ourselves is always challenging.

        Requests that keep Mezmorize short, quote-focused, and true to the Three-minute Memory Method are the easiest to accept. Mezmorize is for Apple platforms only, each item is a quote plus its author, and it does not do free-form key points, pattern extraction, or depend on AI. The Apple Watch companion is review-only by design.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain in concrete terms.
      placeholder: |
        Example: I want to find quotes by a specific author faster.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what Mezmorize should do instead.
      placeholder: |
        Example: Add a tile that groups quotes by author.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Include workarounds or partial solutions you already tried.

  - type: dropdown
    id: scope
    attributes:
      label: Which part of Mezmorize would this affect most?
      options:
        - Review experience
        - Scheduling
        - Import sources
        - Organization (tiles, search, sort)
        - Sharing
        - Platforms
        - Notifications
        - Apple Watch
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Which platforms should this cover?
      options:
        - All platforms
        - macOS
        - iPhone
        - iPad
        - Apple Watch
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Add mockups, examples, or constraints. Please leave out personal data and private quotes.
